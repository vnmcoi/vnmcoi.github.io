<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            font-variant-ligatures: none;
            /* Tắt ligature cho giao diện Index */
            background-color: #fff;
            color: #000;
            padding: 20px;

            /* Thay đổi độ rộng tại đây: Dùng 80% thay vì 900px */
            max-width: 80%;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.6em;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        hr {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 10px 0;
        }

        a {
            color: #0000ee;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #list-container {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            white-space: pre-wrap;
        }

        #content-viewer {
            display: none;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            padding-top: 5px;
        }

        #content-viewer img,
        #content-viewer video {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-variant-ligatures: none;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
        }

        #content-viewer pre,
        #content-viewer code {
            font-family: 'JetBrains Mono', monospace;
            font-variant-ligatures: none;
        }

        #content-viewer pre {
            background: #f5f5f5;
            padding: 12px;
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #content-viewer code {
            background: #f5f5f5;
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* Nhắm thẳng vào tất cả iframe nằm trong phần nội dung bài viết */
        #content-viewer iframe {
            display: block !important;
            /* Ép nó thành dạng khối (không nằm cùng hàng với chữ) */
            margin: 30px auto !important;
            /* Canh giữa tuyệt đối (auto), cách trên/dưới 30px */

            /* Ghi đè thông số 560x315 mặc định của YouTube để nó Responsive */
            width: 100% !important;
            /* Chiếm toàn bộ chiều rộng khả dụng... */
            max-width: 800px !important;
            /* ...nhưng tối đa chỉ to đến 800px cho khỏi bị thô */
            height: auto !important;
            aspect-ratio: 16 / 9;
            /* Tự động giữ đúng tỷ lệ khung hình video */
        }

        /* Thêm đoạn này vào CÙNG trong thẻ <style> (có thể để dưới cùng) */
        @media (max-width: 768px) {
            body {
                /* Trên điện thoại, cho nội dung tràn ra 95% sát viền để dễ đọc */
                max-width: 95%;
                padding: 15px 10px;
            }
        }
    </style>
</head>

<body>

    <h1 id="dir-title">Index of /</h1>
    <hr>

    <pre id="list-container">Loading...</pre>

    <div id="content-viewer"></div>

    <hr>

    <script>
        const USERNAME = 'vnmcoi';
        const REPO = 'vnmcoi.github.io';
        const BRANCH = 'main';

        const container = document.getElementById('list-container');
        const contentViewer = document.getElementById('content-viewer');
        const title = document.getElementById('dir-title');

        async function loadPath(path = '', isFile = false) {
            title.innerText = isFile ? `Viewing: /${path}` : `Index of /${path}`;
            if (isFile) {
                await renderFile(path);
            } else {
                await renderDirectory(path);
            }
        }

        async function renderDirectory(path) {
            contentViewer.style.display = 'none';
            container.style.display = 'block';
            container.innerHTML = 'Loading...';

            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const items = await response.json();

                container.innerHTML = '';

                if (path !== '') {
                    const upLink = document.createElement('a');
                    upLink.href = '#';
                    upLink.innerText = '../';
                    upLink.onclick = (e) => {
                        e.preventDefault();
                        const parts = path.split('/');
                        parts.pop();
                        loadPath(parts.join('/'), false);
                    };
                    container.appendChild(upLink);
                    container.appendChild(document.createTextNode('\n'));
                }

                let filteredItems = path === ''
                    ? items.filter(i => i.type === 'dir' && (i.name === 'editorials' || i.name === 'documents'))
                    : items.filter(i => !i.name.startsWith('.'));

                filteredItems.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

                filteredItems.forEach(item => {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.innerText = item.name + (item.type === 'dir' ? '/' : '');
                    link.onclick = (e) => {
                        e.preventDefault();
                        loadPath(item.path, item.type === 'file');
                    };
                    container.appendChild(link);
                    container.appendChild(document.createTextNode('\n'));
                });
            } catch (err) {
                container.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
            }
        }

        async function renderFile(path) {
            container.style.display = 'none';
            contentViewer.style.display = 'block';
            contentViewer.innerHTML = 'Loading content and MathJax...';

            try {
                const response = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${path}`);
                const text = await response.text();

                const parts = path.split('/');
                parts.pop();
                const parentPath = parts.join('/');

                const backBtnHtml = `<a href="#" class="back-link" onclick="event.preventDefault(); loadPath('${parentPath}', false)">../</a>`;

                let htmlContent = '';
                if (path.endsWith('.md')) {
                    htmlContent = marked.parse(text);
                } else {
                    const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    htmlContent = `<pre><code>${safeText}</code></pre>`;
                }

                contentViewer.innerHTML = backBtnHtml + htmlContent;

                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            } catch (err) {
                contentViewer.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
            }
        }

        window.onload = () => loadPath('');
    </script>
</body>

</html>
